server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nexacare?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# Desativa a execucao automatica de scripts SQL locais que travam no Aiven
spring.sql.init.mode=never
spring.sql.init.encoding=UTF-8

# Deixa o Hibernate criar e atualizar as tabelas automaticamente no Aiven
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.jackson.serialization.write-dates-as-timestamps=false
server.error.include-message=never
server.error.include-stacktrace=never
logging.level.org.hibernate.SQL=warn