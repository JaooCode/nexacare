# Perfil de teste: H2 em modo MySQL, usando os MESMOS schema.sql e data.sql da aplicação.
spring.datasource.url=jdbc:h2:mem:nexacare;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=always
